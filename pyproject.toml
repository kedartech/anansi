[project]
name = "revisionist"
version = "0.0.2"
description = "An AI-run multiplayer statecraft game engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.10",
    "python-ulid>=3.0",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
discord = ["discord.py>=2.7"]
seal = ["cryptography>=43"]

[project.scripts]
revisionist = "revisionist.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.120",
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest-cov>=6.0",
    "types-pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "discord.py>=2.7",
    "cryptography>=43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revisionist"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["revisionist.core"]
