# Nobody is pre-seated: players claim playable cards at Session Zero.
seats: []

roster:
  - entity: roosevelt
    pitch: Third-term President steering a neutral nation toward the Allies.
    reach: Executive orders, the Navy, Lend-Lease, and what Congress will pass.
    composite: false
    sides:
      - {contest: neutrality_revision, side: interventionists}
      - {contest: us_japan_talks, side: usa}
  - entity: churchill
    pitch: Prime Minister holding on until America comes in.
    reach: The War Cabinet, the Chiefs of Staff, and cables to Roosevelt.
    composite: false
    sides: [{contest: atlantic_war, side: uk}]
  - entity: stalin
    pitch: Leader of a country invaded and begging for supplies.
    reach: Stavka, the State Defence Committee, and the Soviet war economy.
    composite: false
    sides: [{contest: atlantic_war, side: ussr}]
  - entity: hitler
    pitch: Fuehrer at the height of his conquests, committed to the East.
    reach: The OKW, the Kriegsmarine, and the U-boat war.
    composite: false
    sides: [{contest: atlantic_war, side: germany}]
  - entity: konoe
    pitch: Prime Minister seeking a settlement with Washington before the Army moves.
    reach: The cabinet, the Liaison Conference, and a summit he cannot arrange alone.
    composite: false
    sides: [{contest: us_japan_talks, side: japan}]
  - entity: tojo
    pitch: War Minister and serving general, the Army's voice in the cabinet.
    reach: The Army Ministry, the Liaison Conference, and the Army's veto on any deal.
    composite: false
    sides: [{contest: us_japan_talks, side: japan}]
