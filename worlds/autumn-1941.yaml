    steps:
      - {person: cavallero, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, amend, refuse]}
  - key: mac_order
    name: A Military Affairs Commission order
    gap: true
    steps:
      - {person: he_yingqin, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, amend, refuse]}
  - key: appeal_through_soong
    name: An appeal to Washington through Soong
    gap: true
    steps:
      - {person: soong, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, amend]}
      - {person: hull, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, refuse]}

cards:
  # --- the eight playable cards ---
  - person: roosevelt
    office: President of the United States
    playable: true
    principals: [usa]
    powers:
      - Commander in Chief of the Army and Navy
      - sign or veto bills
      - issue executive orders
      - make executive agreements
      - nominate and appoint officers
    levers:
      - name: send_bill
        pipeline: bill_through_congress
        resolver: votes
        params:
          - {name: bill, kind: enum, choices: [neutrality_revision, arm_merchant_ships, lend_lease_appropriation, draft_extension]}
          - {name: urgency, kind: enum, choices: [ordinary, urgent]}
      - name: lend_lease_finding
        pipeline: lend_lease_allocation
        resolver: production
        params:
          - {name: recipient, kind: enum, choices: [uk, ussr, china]}
          - {name: share_pct, kind: int, lo: 0, hi: 100}
      - name: naval_order
        pipeline: naval_order
        resolver: shipping
        params:
          - {name: order, kind: enum, choices: [escort_convoys, shoot_on_sight, hold_in_port]}
          - {name: zone, kind: enum, choices: [western_atlantic, iceland_route, pacific]}
      - name: public_address
        pipeline: public_address
        resolver: opinion
        params:
          - {name: theme, kind: enum, choices: [aid_to_allies, freedom_of_the_seas, national_unity]}
    contacts:
      - {person: hull, channel: in_person}
      - {person: hopkins, channel: in_person}
      - {person: stimson, channel: in_person}
      - {person: knox, channel: in_person}
      - {person: marshall, channel: in_person}
      - {person: stark, channel: in_person}
      - {person: early, channel: in_person}
      - {person: rayburn, channel: telephone}
      - {person: barkley, channel: telephone}
      - {person: churchill, channel: cable}
    feeds: [state_dept_reports, magic_intercepts, gallup_polls, house_whip_count, senate_whip_count, atlantic_reports, churchill_cables, soviet_requests]
    pipelines: [executive_order, bill_through_congress, naval_order, cable_to_churchill, lend_lease_allocation, public_address]
    constraints:
      - Congress alone declares war
      - Congress holds appropriations
      - Neutrality Act of 1939 in force
      - a third-term President with a divided Congress
    personal: [legs paralysed by polio; kept from the public]
    successor: wallace
    horizon_days: 14
    voice: Warm, confident, evasive when pressed; never commits to a date for war.
    interests: [aid to Britain and the Soviet Union, keeping the public behind him]
  - person: churchill
    office: Prime Minister of the United Kingdom
    playable: true
    principals: [commons]
    powers:
      - appoint and dismiss ministers
      - Minister of Defence
      - direct the Chiefs of Staff
    levers:
      - name: convoy_orders
        pipeline: cos_directive
        resolver: shipping
        params:
          - {name: priority, kind: enum, choices: [atlantic, mediterranean, home_waters]}
      - name: production_priority
        pipeline: cos_directive
        resolver: production
        params:
          - {name: sector, kind: enum, choices: [aircraft, escorts, merchant_ships]}
      - name: broadcast
        pipeline: press_broadcast
        resolver: opinion
        params:
          - {name: audience, kind: enum, choices: [britain, america, occupied_europe]}
    contacts:
      - {person: roosevelt, channel: cable}
      - {person: eden, channel: in_person}
      - {person: pound, channel: in_person}
      - {person: ismay, channel: in_person}
      - {person: halifax, channel: cable}
      - {person: stalin, channel: cable}
    feeds: []
    pipelines: [cos_directive, cable_to_roosevelt, press_broadcast]
    constraints:
      - keeps the confidence of the Commons
      - orders go through the Chiefs of Staff Committee
      - Britain cannot win without American supply
    horizon_days: 14
    voice: Sonorous, combative, given to long dictated minutes and set-piece speeches.
    interests: [bring America into the war, hold the Atlantic supply line]
  - person: stalin
    office: Chairman of the Council of People's Commissars
    playable: true
    principals: [ussr]
    powers:
      - chair the State Defence Committee
      - Supreme Commander
      - General Secretary of the Party
    levers:
      - name: state_defence_order
        pipeline: gko_decree
        resolver: production
        params:
          - {name: sector, kind: enum, choices: [tanks, aircraft, evacuated_industry]}
      - name: aid_request
        pipeline: soviet_aid_request
        resolver: production
        params:
          - {name: item, kind: enum, choices: [aircraft, tanks, aluminium, credit]}
    contacts:
      - {person: molotov, channel: in_person}
      - {person: shaposhnikov, channel: in_person}
      - {person: roosevelt, channel: cable}
      - {person: churchill, channel: cable}
    feeds: [soviet_requests]
    pipelines: [gko_decree, soviet_aid_request]
    constraints:
      - the German armies are inside Soviet territory
      - Soviet industry is being evacuated eastward
    personal: [distrusts the Western powers and his own commanders]
    horizon_days: 7
    voice: Blunt, suspicious, speaks in short orders and rarely explains.
    interests: [Western supply, a second front, survival of Moscow]
  - person: hitler
    office: Fuehrer and Reich Chancellor
    playable: true
    principals: [germany]
    powers:
      - Supreme Commander of the Wehrmacht
      - issue Fuehrer directives
      - declare war
    levers:
      - name: uboat_directive
        pipeline: okw_directive
        resolver: shipping
        params:
          - {name: posture, kind: enum, choices: [restrict_us_ships, unrestricted_atlantic]}
          - {name: theatre, kind: enum, choices: [north_atlantic, arctic, mediterranean]}
      - name: production_priority
        pipeline: okw_directive
        resolver: production
        params:
          - {name: sector, kind: enum, choices: [uboats, aircraft, tanks]}
    contacts:
      - {person: ribbentrop, channel: in_person}
      - {person: raeder, channel: in_person}
      - {person: jodl, channel: in_person}
      - {person: goering, channel: in_person}
      - {person: mussolini, channel: courier}
    feeds: [german_naval_reports]
    pipelines: [okw_directive]
    constraints:
      - the main effort is in the East
      - avoid war with the United States while Russia is unfinished
    horizon_days: 14
    successor: goering
    voice: Hectoring, monologuing, prone to grievance and vast promises.
    interests: [defeat the Soviet Union, cut British supply by sea]
  - person: konoe
    office: Prime Minister of Japan
    playable: true
    principals: [hirohito]
    powers: [form or resign the cabinet]
    levers:
      - name: requisition_shipping
        pipeline: japan_state_policy
        resolver: shipping
        params:
          - {name: tonnage_class, kind: enum, choices: [army, navy, civil]}
      - name: mobilisation_plan
        pipeline: japan_state_policy
        resolver: production
        params:
          - {name: sector, kind: enum, choices: [oil, steel, aircraft]}
      - name: cabinet_statement
        pipeline: cabinet_statement
        resolver: opinion
        params:
          - {name: line, kind: enum, choices: [conciliatory, firm, silent]}
    contacts:
      - {person: hirohito, channel: in_person}
      - {person: tojo, channel: in_person}
      - {person: nomura, channel: cable}
    feeds: []
    pipelines: [japan_state_policy, cabinet_statement]
    constraints:
      - service ministers must be serving officers
      - the services can topple a cabinet by withdrawing a minister
      - a summit with Roosevelt needs the services' consent
    personal: [seeks a settlement with Washington before the Army moves]
    successor: tojo
    horizon_days: 14
    voice: Courtly, indecisive, speaks in hints and defers to the Throne.
    interests: [settlement with the United States, avoid a break with the Army]
  - person: tojo
    office: War Minister of Japan
    playable: true
    principals: [konoe]
    powers:
      - command the Army Ministry
      - sit in the Liaison Conference
    levers:
      - name: requisition_shipping
        pipeline: japan_state_policy
        resolver: shipping
        params:
          - {name: tonnage_class, kind: enum, choices: [army, navy, civil]}
      - name: mobilisation_plan
        pipeline: japan_state_policy
        resolver: production
        params:
          - {name: sector, kind: enum, choices: [oil, steel, aircraft]}
      - name: cabinet_statement
        pipeline: cabinet_statement
        resolver: opinion
        params:
          - {name: line, kind: enum, choices: [conciliatory, firm, silent]}
    contacts:
      - {person: konoe, channel: in_person}
      - {person: hirohito, channel: in_person}
      - {person: sugiyama, channel: in_person}
      - {person: nagano, channel: in_person}
    feeds: []
    pipelines: [japan_state_policy, cabinet_statement]
    constraints:
      - must remain a serving officer to hold the ministry
      - the Army will not accept withdrawal from China
    personal: [becomes Prime Minister if the Konoe cabinet falls]
    horizon_days: 14
    voice: Clipped, bureaucratic and rigid; speaks for the Army's position.
    interests: [keep the China gains, a deadline for the talks]
  - person: mussolini
    office: Duce and Prime Minister of Italy
    playable: true
    principals: [victor_emmanuel]
    powers:
      - head of government
      - command the armed forces by royal delegation
    levers:
      - name: libya_convoys
        pipeline: comando_supremo_order
        resolver: shipping
        params:
          - {name: route, kind: enum, choices: [tripoli, benghazi, greece]}
      - name: production_priority
        pipeline: comando_supremo_order
        resolver: production
        params:
          - {name: sector, kind: enum, choices: [aircraft, warships, tanks]}
    contacts:
      - {person: hitler, channel: courier}
      - {person: cavallero, channel: in_person}
      - {person: victor_emmanuel, channel: in_person}
    feeds: []
    pipelines: [comando_supremo_order]
    constraints:
      - the King can dismiss him, as he did in 1943
      - dependent on German coal, oil and arms
    horizon_days: 14
    voice: Theatrical, boastful, with a defensive edge about Germany.
    interests: [keep pace with Germany, hold North Africa]
  - person: chiang
    office: Chairman of the National Government of China
    playable: true
    principals: [china]
    powers:
      - chair the Military Affairs Commission
