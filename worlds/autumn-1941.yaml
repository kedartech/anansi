notes:
  - "Allied merchant losses to U-boats: Sep 209,835 GRT is the quantity; Oct 176,622 and Nov 120,541 GRT are the record for the shipping resolver."
  - "Gallup 8 Oct 1941: Roosevelt 'about right' 57%, 'too far' 27%, 'not far enough' 16%. Gallup 22 Nov: 26% for war on Germany. Quantities start as gaps."
  - "Soviet finding: FDR's 30 Oct letter to Stalin pledged up to $1bn before the 7 Nov finding (SOURCES.md)."
  - "MAGIC: Navy carried the White House copies in even months from mid-1941 and was fully responsible from 6 Dec. The courier and takeover date are gaps."
  - "The 12 Aug draft extension passed the House 203-202; it precedes the start and serves as the counterfactual lever."
  - "Step lengths are sourced for the bill through Congress only. The rest, and every feed cadence, are labelled defaults (assumed: true). Card horizons are unsourced."
  - "Gallup: 'about right' 57% was asked 19-24 Sep and released 8 Oct, a 14-day lag; the poll feed's latency uses it."
