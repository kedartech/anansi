    levers:
      - name: arsenal_output
        pipeline: mac_order
        resolver: production
        params:
          - {name: sector, kind: enum, choices: [small_arms, artillery, ammunition]}
      - name: appeal_abroad
        pipeline: appeal_through_soong
        resolver: opinion
        params:
          - {name: audience, kind: enum, choices: [america, britain]}
    contacts:
      - {person: soong, channel: cable}
      - {person: he_yingqin, channel: in_person}
      - {person: roosevelt, channel: cable}
      - {person: churchill, channel: cable}
    feeds: []
    pipelines: [mac_order, appeal_through_soong]
    constraints:
      - China is cut off except by the Burma Road
      - the Communist armies keep a separate command
    horizon_days: 14
    voice: Stern, moralising, impatient with allies who promise more than they send.
    interests: [American aid, keep Japan tied down in China]
