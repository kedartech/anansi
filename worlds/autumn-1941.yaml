sources:
  - key: voteview
    title: "Voteview: congressional roll-call votes"
    note: "Roll calls RH0770063, RH0770068, RS0770084 (SOURCES.md, agreed by both readers). The 13 Nov House concurrence is single-reader."
    verified: true
  - key: frus_1941
    title: Foreign Relations of the United States, 1941, vol. I
    note: "Soviet Lend-Lease eligibility finding, letter to Stettinius, 7 Nov 1941 (SOURCES.md, agreed)."
    verified: true
  - key: congress_77th
    title: Party division at the start of the 77th Congress (Clerk of the House)
    note: "SOURCES.md. Counted at Jan 1941, not 1 Sep. Readers differ by one House seat (+-1 gap)."
  - key: uboat_war_tables
    title: Allied merchant losses to U-boats by month, 1941 (GRT)
    note: "Phase 0b note (agreed). The underlying table is not named there; name it before release."
    verified: true
  - key: us_war_production
    title: US wartime production totals, 1941 (aircraft; merchant ship deliveries)
    note: "Phase 0b note (agreed). The underlying table is not named there; name it before release."
    verified: true
  - key: lend_lease_appropriations
    title: Second Lend-Lease Appropriation, October 1941
    note: "Phase 0b note (agreed): $5,985,000,000. The statute is not cited there."
    verified: true
  - key: rohwer_uboats
    title: Rohwer, via a table of U-boats operational in the Atlantic
    note: "SOURCES.md: about 30, a Jul-Sep 1941 average, not a September count. Blair would settle it."
  - key: hjr237_timeline
    title: "H.J.Res. 237 (Neutrality revision), 1941: from message to signature"
    note: "FDR's message 9 Oct (H. Doc. 77-404); House 17 Oct 259-138 (RH0770068); Senate 7 Nov 50-37 (RS0770084); House concurs 13 Nov 212-194 (RH0770070); signed 17 Nov."
    verified: true
  - key: gallup_1941
    title: Gallup polls of 1941 (ibiblio transcription)
    note: "SOURCES.md: 8 Oct 1941 FDR 'about right' 57%, 'too far' 27%, 'not far enough' 16%; 22 Nov 26% for war on Germany."

